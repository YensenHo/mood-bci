# ============================================================
# eegscope 64 通道配置（4 × 16ch RT-BCI 板）
# 用法：python main.py config64.yaml
# ============================================================

# 采样率（Hz）。真实硬件以数据源为准：16ch 每通道 125Hz。
sample_rate: 250

# 64 通道名。顺序 = 物理接线顺序：
#   板1 → 通道 1-16，板2 → 通道 17-32，板3 → 通道 33-48，板4 → 通道 49-64。
# 每块 16ch 板内部：下层 1P-8P = 通道 1-8，上层(EXP 菊花链) = 通道 9-16。
# 帽 = 国际 10-20 扩展(10-10)，62 个信号位（无 AFz/AF7/AF8；CPz 是信号，REF/GND/A1/A2 是参考地）。
# 所以有 2 个空通道：板1 7P(原 AF8)、板4 8P，都用 NC 占位（不接电极）。
# ⚠️ 这个顺序必须和「你物理上把电极接到 4 块板哪个通道」完全一致；接法变了就改这里。
channels:
  # 板1（额区）通道 1-16（4P 空=AF7不存在，改接 CPz；7P 空=AF8不存在）
  - Fp1
  - Fpz
  - Fp2
  - CPz
  - AF3
  - AF4
  - NC
  - F7
  - F5
  - F3
  - F1
  - Fz
  - F2
  - F4
  - F6
  - F8
  # 板2（额中央 + 中央）通道 17-32
  - FT7
  - FC5
  - FC3
  - FC1
  - FCz
  - FC2
  - FC4
  - FC6
  - FT8
  - T7
  - C5
  - C3
  - C1
  - Cz
  - C2
  - C4
  # 板3（中央后 + 中央顶 + 顶）通道 33-48
  - C6
  - T8
  - TP7
  - CP5
  - CP3
  - CP1
  - CP2
  - CP4
  - CP6
  - TP8
  - P7
  - P5
  - P3
  - P1
  - Pz
  - P2
  # 板4（顶后 + 顶枕 + 枕 + 耳下）通道 49-64，第 64 通道空
  - P4
  - P6
  - P8
  - PO7
  - PO5
  - PO3
  - POz
  - PO4
  - PO6
  - PO8
  - O1
  - Oz
  - O2
  - CB1
  - CB2
  - NC

source:
  type: openbci
  openbci:
    # 4 块板的串口（板1~板4 顺序必须与上面 channels 分组一致）
    # 跨平台：填 "AUTO" 自动扫描 STM32 串口（Windows COM / macOS usbmodem / Linux ttyACM）。
    # 但自动扫描是 USB 枚举顺序，不一定=物理板序；要通道名正确，先跑
    # scripts/identify_boards.py 摸电极识板，再把 4 个真串口名按板序填回来。
    ports:
      - "AUTO"
    baudrate: 115200      # USB CDC 虚拟串口，实际不敏感
    n_channels: 16        # 每块板 16 通道
    gain: 24.0            # 缩放用增益
    scale_uv: 0.0         # 0 = 按 gain 自动算
    gain_code: -1         # ⚠️ 本板固件 x 指令有 bug(清零 CONFIG)，保持 -1 不发送

dsp:
  bandpass_hz: [0.5, 45.0] # 带通 0.5–45 Hz
  notch_hz: [50.0, 25.0]   # 陷波：50Hz 工频 + 25Hz 硬件振荡
  notch_q: 30.0

analysis:
  window_seconds: 2.0
  bands:
    delta: [0.5, 4.0]
    theta: [4.0, 8.0]
    alpha: [8.0, 13.0]
    beta: [13.0, 30.0]
    gamma: [30.0, 45.0]
  faa_channels: ["F3", "F4"]

viz:
  window_seconds: 5.0
  refresh_ms: 50
  channel_spacing_uv: 40.0  # 64 通道堆叠，间距调小（64×40=2560µV 纵向范围）
