name: build-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖 + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r software/requirements.txt pyinstaller
      - name: PyInstaller 打包
        working-directory: software
        run: python -m PyInstaller --noconfirm --clean packaging/eegscope.spec
      - name: 打 zip（直接下载包）
        shell: bash
        working-directory: software/dist
        run: |
          python -c "import shutil; shutil.make_archive('eegscope-release', 'zip', '.', 'eegscope')"
          mv eegscope-release.zip eegscope-windows.zip
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: eegscope-windows.zip
          path: software/dist/eegscope-windows.zip
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖 + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r software/requirements.txt pyinstaller
      - name: PyInstaller 打包
        working-directory: software
        run: python -m PyInstaller --noconfirm --clean packaging/eegscope.spec
      - name: 打 zip（直接下载包）
        shell: bash
        working-directory: software/dist
        run: |
          python -c "import shutil; shutil.make_archive('eegscope-release', 'zip', '.', 'eegscope')"
          mv eegscope-release.zip eegscope-macos.zip
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: eegscope-macos.zip
          path: software/dist/eegscope-macos.zip
          if-no-files-found: error

  release:
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: 发布 Release（可直接下载的 zip）
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
          prerelease: ${{ github.ref == 'refs/tags/v1.1.5' || github.ref == 'refs/tags/v1.1.6' }}
          body: ${{ github.ref == 'refs/tags/v1.1.6' && '测试版：尚未经过真实脑电板验证。清理录制开始前的各板接收积压并记录丢弃数量，避免数秒旧数据直接拼接；新增半帧校验及录制暂停保护。此软件近似处理不构成硬件同步，设备内部残留、传输延迟及独立时钟漂移仍须共同事件实测。旧录制不能自动修复。' || (github.ref == 'refs/tags/v1.1.5' && '测试版：尚未经过真实脑电板验证。修复录制样本积压处理、逐块滤波伪影和 EDF 导出格式，增加录制时长对照。模拟测试通过；多板硬件同步及长时间掉线仍需实机验证，旧数据的缺失与饱和不能通过本版本恢复。' || '') }}
